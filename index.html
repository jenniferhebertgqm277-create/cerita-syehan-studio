    border-radius: 18px;

<script src="assets/three.min.js"></script>

// 3D Confetti Particles
const CONFETTI_COUNT = 90;

// -------------------------------------------------------------
// KINETIC TIKTOK SUBTITLE OVERLAY (THREE.JS TEXTURE PLANE)
// -------------------------------------------------------------
const subCanvas = document.createElement('canvas');
subCanvas.width = 1080;
subCanvas.height = 600;
const subCtx = subCanvas.getContext('2d');
const subTex = new THREE.CanvasTexture(subCanvas);
const subMat = new THREE.MeshBasicMaterial({ map: subTex, transparent: true, depthTest: false });
const subPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.33), subMat);
subPlane.position.set(0, -0.95, -2.8);
subPlane.renderOrder = 9999;
camera.add(subPlane);
scene.add(camera);

function drawSubtitles(t) {
  subCtx.clearRect(0, 0, 1080, 600);
  
  let currentSentence = null;
  for (const s of SENTENCES) {
    if (t >= s.t0 && t < s.t1) {
      currentSentence = s;
      break;
    }
  }
  if (!currentSentence) {
    subPlane.visible = false;
    subTex.needsUpdate = true;
    return;
  }
  
  subPlane.visible = true;
  subCtx.save();
  subCtx.font = '900 50px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  subCtx.textAlign = 'center';
  
  const text = currentSentence.text;
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (let w of words) {
    const testLine = line + (line ? ' ' : '') + w;
    if (subCtx.measureText(testLine).width > 860 && line) {
      lines.push(line);
      line = w;
    } else {
      line = testLine;
    }
  }
  lines.push(line);
  
  const lineH = 68;
  const startY = 300 - ((lines.length - 1) * lineH) / 2;
  
  lines.forEach((l, idx) => {
    const ly = startY + idx * lineH;
    const lw = subCtx.measureText(l).width;
    subCtx.fillStyle = 'rgba(15, 23, 42, 0.90)';
    subCtx.beginPath();
    subCtx.roundRect(540 - lw / 2 - 24, ly - 44, lw + 48, 58, 16);
    subCtx.fill();
    
    subCtx.fillStyle = '#FBBF24';
    subCtx.fillText(l, 540, ly);
  });
  
  subCtx.restore();
  subTex.needsUpdate = true;
}

// -------------------------------------------------------------
// MAIN TIMELINE ANIMATION FUNCTION (72.36s / 8 Acts)
// -------------------------------------------------------------
function renderFrame(t) {
  // Reset all prop visibilities
  badgeMesh.visible = false;
  keyboardGroup.visible = false;
  qMarkMesh.visible = false;
  clockMesh.visible = false;
  bulbGroup.visible = false;
  robotGroup.visible = false;
  errMesh.visible = false;
  gadgetGroup.visible = false;
  smokeGroup.visible = false;
  shadesGroup.visible = false;
  followMesh.visible = false;
  confettiInst.visible = false;
  
  // Default lighting
  ambientLight.color.setHex(0xFFF7ED);
  ambientLight.intensity = 0.75;
  keyLight.color.setHex(0xFFFBF0);
  
  if (t < 5.58) {
    // ---------------------------------------------------------
    // ACT 1: THE HOOK & STOP! (0.0s - 5.58s)
    // ---------------------------------------------------------
    const shake = (t > 1.6 && t < 2.4) ? Math.sin(t * 50) * 0.08 * Math.exp(-(t - 1.6) * 3) : 0;
    camera.position.set(shake, 1.8, 3.6); // Tight dramatic punch
    camera.lookAt(0, 1.85, 0.45);
    
    // Hand raised right into camera lens on STOP!
    if (t > 1.6) {
      armR.rotation.x = -1.45;
      armR.rotation.z = -0.3;
      handR.position.set(0.1, -0.2, 0.45);
      mouth.scale.set(1.5, 1.7, 1.0); // Shocked open mouth
      browL.position.y = 0.79; browR.position.y = 0.79;
    } else {
      armR.rotation.x = -0.3;
      mouth.scale.set(1.0, 0.8, 1.0);
    }
    headGroup.rotation.y = Math.sin(t * 6) * 0.04;
    
  } else if (t < 16.34) {
    // ---------------------------------------------------------
    // ACT 2: 100% CODE PROOF (5.58s - 16.34s)
    // ---------------------------------------------------------
    const prog = (t - 5.58) / (16.34 - 5.58);
    camera.position.set(0.4 * Math.sin(prog * Math.PI), 1.95, 4.4);
    camera.lookAt(0, 1.7, 0);
    
    // Syehan typing gesture & proud pose
    armL.rotation.x = -0.8 + Math.sin(t * 12) * 0.1;
    armR.rotation.x = -0.8 + Math.cos(t * 12) * 0.1;
    
    // Floating keyboard visible
    keyboardGroup.visible = true;
    keyboardGroup.position.y = 1.35 + Math.sin(t * 4) * 0.03;
    
    headGroup.rotation.set(-0.05, Math.sin(t * 3) * 0.06, 0);
    mouth.scale.set(1.1, 0.9, 1.0);
    browL.position.y = 0.75; browR.position.y = 0.75;
    
  } else if (t < 22.28) {
    // ---------------------------------------------------------
    // ACT 3: HOST INTRO "GUE SYEHAN" (16.34s - 22.28s)
    // ---------------------------------------------------------
    camera.position.set(0.2, 1.85, 4.5);
    camera.lookAt(0, 1.7, 0);
    
    // Friendly wave
    armR.rotation.x = -1.2;
    armR.rotation.z = Math.sin(t * 8) * 0.4 + 0.6;
    armL.rotation.x = 0;
    
    headGroup.rotation.set(0.05, Math.sin(t * 2) * 0.08, 0.04);
    mouth.scale.set(1.2, 0.6, 1.0); // Big friendly smile
    
    badgeMesh.visible = true;
    badgeMesh.scale.setScalar(Math.min(1.0, (t - 16.8) * 3));
    
  } else if (t < 30.22) {
    // ---------------------------------------------------------
    // ACT 4: AGAK NGGAK NORMAL / ABSURD (22.28s - 30.22s)
    // ---------------------------------------------------------
    // Playful Dutch angle camera tilt
    camera.position.set(-0.35, 1.8, 4.3);
    camera.rotation.z = -0.06;
    camera.lookAt(0, 1.75, 0.2);
    
    // Syehan scratching head in funny embarrassment
    armR.rotation.x = -1.8;
    armR.rotation.z = -0.6;
    armR.rotation.y = 0.3;
    handR.position.set(-0.15, 0.2, 0.1);
    
    headGroup.rotation.z = -0.18;
    browL.position.y = 0.71; browR.position.y = 0.78;
    mouth.scale.set(0.8, 0.65, 1.0);
    
    if (t > 27.5) {
      qMarkMesh.visible = true;
      qMarkMesh.position.y = 2.7 + Math.sin(t * 6) * 0.06;
    }
    
  } else if (t < 43.92) {
    // ---------------------------------------------------------
    // ACT 5: JAM 2 PAGI & ROBOT EXPERIMENT (30.22s - 43.92s)
    // ---------------------------------------------------------
    camera.rotation.z = 0;
    camera.position.set(0, 1.9, 4.4);
    camera.lookAt(0, 1.8, 0);
    
    // Dark midnight mood lighting
    ambientLight.color.setHex(0x1E3A8A); // Deep blue
    ambientLight.intensity = 0.55;
    keyLight.color.setHex(0xFBBF24); // Warm desk lamp
    
    clockMesh.visible = true;
    
    if (t > 33.5) {
      bulbGroup.visible = true;
      bulbGroup.position.y = 3.1 + Math.sin(t * 6) * 0.05;
      
      robotGroup.visible = true;
      robotGroup.rotation.y = Math.sin(t * 4) * 0.3;
      
      headGroup.rotation.set(-0.08, 0, 0);
      mouth.scale.set(1.3, 1.2, 1.0);
      browL.position.y = 0.77; browR.position.y = 0.77;
    }
    
  } else if (t < 51.58) {
    // ---------------------------------------------------------
    // ACT 6: DEBUGGING CRISIS / LUPA MAKAN (44.28s - 51.58s)
    // ---------------------------------------------------------
    camera.position.set(0, 1.8, 4.2);
    camera.lookAt(0, 1.7, 0);
    
    updateScreenTexture('error');
    errMesh.visible = true;
    errMesh.position.y = 2.6 + Math.sin(t * 8) * 0.04;
    
    // Slumped exhausted posture, clutching stomach
    armL.rotation.x = -0.6; armL.rotation.z = 0.4;
    armR.rotation.x = -0.6; armR.rotation.z = -0.4;
    hips.position.y = 0.98;
    headGroup.rotation.set(0.12, 0, 0);
    browL.position.y = 0.70; browR.position.y = 0.70;
    mouth.scale.set(0.9, 0.5, 1.0);
    
  } else if (t < 61.38) {
    // ---------------------------------------------------------
    // ACT 7: GADGET EXPLOSION / KADANG MELEDAK (52.16s - 61.38s)
    // ---------------------------------------------------------
    updateScreenTexture('code');
    camera.position.set(0, 1.85, 4.3);
    camera.lookAt(0, 1.7, 0);
    
    gadgetGroup.visible = true;
    gizmoRotor.rotation.y = t * 18; // Crazy spinning
    
    if (t > 57.5) {
      smokeGroup.visible = true; // Smoke puff
      smokeGroup.scale.setScalar(Math.min(1.5, (t - 57.5) * 2));
      mouth.scale.set(1.4, 1.5, 1.0); // Shocked
    }
    
  } else {
    // ---------------------------------------------------------
    // ACT 8: GRAND FINALE & TIKTOK FOLLOW CTA (61.38s - 72.36s)
    // ---------------------------------------------------------
    camera.position.set(0, 1.85, 4.5);
    camera.lookAt(0, 1.7, 0);
    
    // Deal With It Shades drop
    shadesGroup.visible = true;
    const dropProg = Math.min(1.0, (t - 61.5) * 1.6);
    shadesGroup.position.set(0, 2.8 - dropProg * 0.75, 0.85);
    
    // Follow button drops and bounces
    followMesh.visible = true;
    const bounceProg = Math.min(1.0, (t - 62.0) * 2.0);
    followMesh.position.y = 3.5 - bounceProg * 0.7 + Math.sin(t * 8) * 0.04;
    
    // Thumbs pointing at follow button
    armL.rotation.x = -1.2; armL.rotation.z = -0.5;
    armR.rotation.x = -1.2; armR.rotation.z = 0.5;
    
    // 3D Confetti particles celebration
    confettiInst.visible = true;
    for (let i = 0; i < CONFETTI_COUNT; i++) {
      const p = confettiData[i];
      const age = t - 61.5;
      dummy.position.set(p.x, p.y + p.vy * age, p.z);
      dummy.rotation.set(p.rx + age * 2, p.ry + age * 2, 0);
      dummy.updateMatrix();
      confettiInst.setMatrixAt(i, dummy.matrix);
    }
    confettiInst.instanceMatrix.needsUpdate = true;
  }
  
  // Natural idle breathing
  hips.position.y = (t >= 44.28 && t < 51.58) ? 0.98 : 1.05 + Math.sin(t * 3.5) * 0.02;
  
  // Update subtitles
  drawSubtitles(t);
  
  // Render scene + overlay
  renderer.render(scene, camera);
}

// -------------------------------------------------------------
// EXPORT FOR HEADLESS RUNNER (render.mjs / GitHub Actions)
// -------------------------------------------------------------
window.DUR = TOTAL_DURATION;
window.READY = true;
window.renderAt = (t) => { renderFrame(t); };
window.getCanvasDataURL = (type = 'image/jpeg', q = 0.95) => canvas.toDataURL(type, q);
window.setResolution = (w, h) => {
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  subCanvas.width = w;
  subCanvas.height = Math.round(w * (600 / 1080));
};

// Local Interactive Player
let isPlaying = false;
let startTime = 0;
let pauseTime = 0;

const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const timeDisplay = document.getElementById('time-display');

function animate() {
  if (isPlaying) {
    const elapsed = (performance.now() - startTime) / 1000;
    if (elapsed >= TOTAL_DURATION) {
      isPlaying = false;
      renderFrame(TOTAL_DURATION);
      timeDisplay.textContent = `${TOTAL_DURATION.toFixed(2)} / ${TOTAL_DURATION.toFixed(2)} s`;
      return;
    }
    renderFrame(elapsed);
    timeDisplay.textContent = `${elapsed.toFixed(2)} / ${TOTAL_DURATION.toFixed(2)} s`;
    requestAnimationFrame(animate);
  }
}

btnPlay.addEventListener('click', () => {
  if (!isPlaying) {
    isPlaying = true;
    startTime = performance.now() - pauseTime * 1000;
    animate();
  }
});

btnPause.addEventListener('click', () => {
  if (isPlaying) {
    isPlaying = false;
    pauseTime = (performance.now() - startTime) / 1000;
  }
});

// Render initial frame
renderFrame(0);

})();
