<title>Cerita Syehan — Episode 0 (Modern Studio)</title>
<style>

    --bg: #0F172A;
    --card: #1E293B;
    --accent: #38BDF8;
    --text: #F8FAFC;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    overflow: hidden;
  }
  #canvas-container {
    position: relative;
    width: 360px;
    height: 640px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 25px 60px rgba(0,0,0,0.6);
    background: #000;
  }
  #webgl-canvas {
    width: 100%;
    height: 100%;
    display: block;
  }
  .controls {
    margin-top: 14px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  button {
    background: #2563EB;
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #1D4ED8; }
  #time-display {
    font-family: monospace;
    font-size: 14px;
    color: #94A3B8;

</style>
<script src="assets/three.min.js"></script>
</head>

const subMat = new THREE.MeshBasicMaterial({ map: subTex, transparent: true, depthTest: false });
const subPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.33), subMat);
subPlane.position.set(0, -0.95, -2.8);
subPlane.renderOrder = 9999;
camera.add(subPlane);
scene.add(camera);

function drawSubtitles(t) {
  subCtx.clearRect(0, 0, 1080, 600);
  
  let currentSentence = null;
  for (const s of SENTENCES) {
    if (t >= s.t0 && t < s.t1) {
      currentSentence = s;
      break;
    }
  }
  if (!currentSentence) {
    subPlane.visible = false;
    subTex.needsUpdate = true;
    return;
  }
  
  subPlane.visible = true;
  subCtx.save();
  subCtx.font = '900 52px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
  subCtx.textAlign = 'center';
  
  // Text wrap helper
  const text = currentSentence.text;
  const words = text.split(' ');
  let line = '';
  const lines = [];
  for (let w of words) {
    const testLine = line + (line ? ' ' : '') + w;
    if (subCtx.measureText(testLine).width > 880 && line) {
      lines.push(line);
      line = w;
    } else {
      line = testLine;
    }
  }
  lines.push(line);
  
  const lineH = 68;
  const startY = 300 - ((lines.length - 1) * lineH) / 2;
  
  lines.forEach((l, idx) => {
    const ly = startY + idx * lineH;
    
    // Black pill background behind subtitles
    const lw = subCtx.measureText(l).width;
    subCtx.fillStyle = 'rgba(15, 23, 42, 0.88)';
    subCtx.beginPath();
    subCtx.roundRect(540 - lw / 2 - 24, ly - 44, lw + 48, 58, 16);
    subCtx.fill();
    
    // Glowing text
    subCtx.fillStyle = '#FBBF24'; // Yellow pop highlight
    subCtx.fillText(l, 540, ly);
  });
  
  subCtx.restore();
  subTex.needsUpdate = true;
}

// -------------------------------------------------------------
// MAIN TIMELINE ANIMATION FUNCTION (renderFrame at time t)
// -------------------------------------------------------------
function renderFrame(t) {
  // 1. Camera Animation & Staging
  if (t < 3.76) {
    // SHOT 1: THE HOOK
    const shake = t < 0.6 ? Math.sin(t * 45) * 0.05 * Math.exp(-t * 4) : 0;
    camera.position.set(shake, 1.8, 3.8); // Closer zoom punch
    camera.lookAt(0, 1.85, 0.45);
    
    // Syehan raises hand to camera: "Stop/Wait!"
    armR.rotation.x = -1.4;
    armR.rotation.z = -0.4;
    handR.position.set(0.1, -0.2, 0.4);
    headGroup.rotation.y = Math.sin(t * 8) * 0.05;
    headGroup.rotation.x = -0.1;
    
    // Shocked / alert eyebrows
    browL.position.y = 0.78;
    browR.position.y = 0.78;
    mouth.scale.set(1.4, 1.8, 1.0); // Open mouth "Wait!"
    
  } else if (t < 8.98) {
    // SHOT 2: GREETING & MODERN ROOM REVEAL
    const p = (t - 3.76) / (8.98 - 3.76);
    camera.position.set(0.3 * Math.sin(p * Math.PI), 1.85, 4.6);
    camera.lookAt(0, 1.7, 0);
    
    // Syehan waving friendly
    armR.rotation.x = -1.1;
    armR.rotation.z = Math.sin(t * 7) * 0.4 + 0.6;
    armL.rotation.x = 0;
    
    // Smile
    headGroup.rotation.set(0.05, Math.sin(t * 3) * 0.08, 0.02);
    mouth.scale.set(1.2, 0.6, 1.0);
    browL.position.y = 0.74; browR.position.y = 0.74;
    
    // Show Name Badge
    badgeMesh.visible = true;
    badgeMesh.scale.setScalar(Math.min(1.0, (t - 3.76) * 3));
    
  } else if (t < 15.65) {
    // SHOT 3: ABSURD PROBLEMS & OVERWHELM
    badgeMesh.visible = false;
    camera.position.set(-0.2, 1.8, 4.2);
    camera.lookAt(0, 1.75, 0.2);
    
    // Syehan scratching head in confusion
    armR.rotation.x = -1.8;
    armR.rotation.z = -0.6;
    armR.rotation.y = 0.3;
    handR.position.set(-0.15, 0.2, 0.1);
    
    headGroup.rotation.z = -0.15; // Tilted head
    browL.position.y = 0.70; browR.position.y = 0.78; // One brow raised
    mouth.scale.set(0.8, 0.7, 1.0);
    
    // Phone & Notifs floating
    phoneGroup.visible = true;
    phoneGroup.position.y = 2.2 + Math.sin(t * 3) * 0.08;
    phoneGroup.rotation.y = Math.sin(t * 2) * 0.2;
    
  } else if (t < 21.60) {
    // SHOT 4: OVERTHINKING & CRAZY INNOVATION
    phoneGroup.visible = false;
    
    // Room mood changes
    ambientLight.color.setHex(0x38BDF8); // Midnight blue
    ambientLight.intensity = 0.55;
    keyLight.color.setHex(0xFBBF24); // Warm golden desk lamp
    
    camera.position.set(0, 1.9, 4.3);
    camera.lookAt(0, 1.8, 0);
    
    // Clock 02:00 AM visible
    clockMesh.visible = true;
    
    if (t > 17.5) {
      // Lightbulb pops ON! Idea moment!
      bulbGroup.visible = true;
      bulbGroup.position.y = 3.1 + Math.sin(t * 6) * 0.05;
      
      gadgetGroup.visible = true;
      gizmoRotor.rotation.y = t * 12; // Spinning gizmo
      
      headGroup.rotation.set(-0.1, 0, 0);
      mouth.scale.set(1.3, 1.2, 1.0);
      browL.position.y = 0.77; browR.position.y = 0.77;
    }
    
  } else {
    // SHOT 5: SWAG CTA & GRAND FINALE
    clockMesh.visible = false;
    bulbGroup.visible = false;
    gadgetGroup.visible = false;
    
    ambientLight.color.setHex(0xFFF7ED);
    ambientLight.intensity = 0.8;
    
    camera.position.set(0, 1.85, 4.5);
    camera.lookAt(0, 1.7, 0);
    
    // Deal With It Sunglasses drop
    shadesGroup.visible = true;
    const dropProg = Math.min(1.0, (t - 21.6) * 1.5);
    shadesGroup.position.set(0, 2.8 - dropProg * 0.75, 0.85); // Drops over eyes
    
    // Follow button drops and bounces
    followMesh.visible = true;
    const bounceProg = Math.min(1.0, (t - 22.0) * 2.0);
    followMesh.position.y = 3.5 - bounceProg * 0.7 + Math.sin(t * 8) * 0.04;
    
    // Both thumbs pointing at button
    armL.rotation.x = -1.2; armL.rotation.z = -0.5;
    armR.rotation.x = -1.2; armR.rotation.z = 0.5;
    
    // Confetti particles
    confettiInst.visible = true;
    for (let i = 0; i < CONFETTI_COUNT; i++) {
      const p = confettiData[i];
      const age = t - 21.6;
      dummy.position.set(p.x, p.y + p.vy * age, p.z);
      dummy.rotation.set(p.rx + age * 2, p.ry + age * 2, 0);
      dummy.updateMatrix();
      confettiInst.setMatrixAt(i, dummy.matrix);
    }
    confettiInst.instanceMatrix.needsUpdate = true;
  }
  
  // Natural subtle breathing
  hips.position.y = 1.05 + Math.sin(t * 3.5) * 0.02;
  
  // Draw subtitles (texture update)
  drawSubtitles(t);

  // Render 3D Scene + Subtitles
  renderer.render(scene, camera);
}

// -------------------------------------------------------------
// EXPORT FOR HEADLESS RUNNER (render.mjs / GitHub Actions)
// -------------------------------------------------------------
window.DUR = TOTAL_DURATION;
window.READY = true;
window.renderAt = (t) => { renderFrame(t); };
window.getCanvasDataURL = (type = 'image/jpeg', q = 0.95) => canvas.toDataURL(type, q);
window.setResolution = (w, h) => {
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  subCanvas.width = w;
  subCanvas.height = h;
};

// Local Interactive Player
let isPlaying = false;
let startTime = 0;
let pauseTime = 0;

const btnPlay = document.getElementById('btn-play');
const btnPause = document.getElementById('btn-pause');
const timeDisplay = document.getElementById('time-display');

function animate() {
  if (isPlaying) {
    const elapsed = (performance.now() - startTime) / 1000;
    if (elapsed >= TOTAL_DURATION) {
      isPlaying = false;
      renderFrame(TOTAL_DURATION);
      timeDisplay.textContent = `${TOTAL_DURATION.toFixed(2)} / ${TOTAL_DURATION.toFixed(2)} s`;
      return;
    }
    renderFrame(elapsed);
    timeDisplay.textContent = `${elapsed.toFixed(2)} / ${TOTAL_DURATION.toFixed(2)} s`;
    requestAnimationFrame(animate);
  }
}

btnPlay.addEventListener('click', () => {
  if (!isPlaying) {
    isPlaying = true;
    startTime = performance.now() - pauseTime * 1000;
    animate();
  }
});

btnPause.addEventListener('click', () => {
  if (isPlaying) {
    isPlaying = false;
    pauseTime = (performance.now() - startTime) / 1000;
  }
});

// Render initial frame (t=0)
renderFrame(0);

})();
</script>
